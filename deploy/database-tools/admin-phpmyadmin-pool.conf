[harbor-admin-phpmyadmin]
user = harbor-admin-dbtools
group = harbor-admin-dbtools
listen = /run/php/harbor-admin-phpmyadmin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 20s
clear_env = yes
env[HARBOR_TOOL_ROLE] = admin
chdir = /usr/share/phpmyadmin
security.limit_extensions = .php
php_admin_value[session.save_path] = /var/lib/harbor-admin-phpmyadmin/sessions
php_admin_value[session.cookie_path] = /tools/admin/phpmyadmin
php_admin_value[upload_tmp_dir] = /var/lib/harbor-admin-phpmyadmin/tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[open_basedir] = /usr/share/phpmyadmin:/usr/share/php:/etc/phpmyadmin:/etc/harbor:/var/lib/phpmyadmin:/var/lib/harbor-admin-phpmyadmin:/tmp:/run/harbor-agent:/usr/local/share/harbor/database-tools
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
