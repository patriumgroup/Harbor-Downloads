# The runtime rules are generated at /etc/harbor/harbor-modsecurity.conf.
# This template documents the Ubuntu 24.04 package paths used by the worker.
Include /etc/nginx/modsecurity.conf
SecAuditEngine Off
SecRuleEngine DetectionOnly
Include /etc/modsecurity/crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf
