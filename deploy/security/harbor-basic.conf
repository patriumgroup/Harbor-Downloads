# Include in each protected NGINX server block. Requires harbor-http.conf.
# These return-only if statements are safe in the rewrite phase.
if ($harbor_sensitive_path) { return 403; }
if ($harbor_traversal) { return 403; }
limit_req zone=harbor_requests burst=40 nodelay;
limit_req_status 429;
# These basic rules are deliberately small. They are not SQL/XSS body inspection.
