# Install in /etc/nginx/conf.d/harbor-http.conf (http context).
# Do not trust X-Forwarded-For or CF-Connecting-IP from arbitrary peers.
upstream harbor_gateway { server unix:/run/harbor-web.sock; }
upstream harbor_pgadmin { server unix:/run/harbor-pgadmin.sock; }
upstream harbor_admin_pgadmin { server unix:/run/harbor-admin-pgadmin.sock; }
limit_req_zone $binary_remote_addr zone=harbor_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=harbor_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=harbor_tools:10m rate=60r/s;
log_format harbor_login '$time_iso8601 $remote_addr $status';
log_format harbor_site escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":"$status","bytes":"$body_bytes_sent","duration":"$request_time","request_id":"$request_id","rate":"$limit_req_status","agent":"$http_user_agent"}';
log_format harbor_panel escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":"$status","duration":"$request_time","request_id":"$request_id"}';
map $uri $harbor_sensitive_path {
    default 0;
    ~*(^|/)\.(git|svn|hg)(/|$) 1;
    ~*(^|/)\.env(\.|/|$) 1;
    ~*(^|/)(etc/(passwd|shadow)|proc/self)(/|$) 1;
}
map $request_uri $harbor_traversal {
    default 0;
    ~*(\.\.|%2e%2e|%2e\.|\.%2e|%252e|%00|%2500|%5c|%255c) 1;
}
